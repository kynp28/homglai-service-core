# Development / test databases only. The API server is not containerised here.
# When you add an API service, give the photo folder (IMAGE_STORAGE_DIR) its own named volume,
# e.g.  volumes: - repair_photos:/app/apps/api/data/uploads
# so photos survive container rebuilds, and keep its backups no longer than IMAGE_RETENTION_DAYS
# after an order closes (PDPA).
services:
  mysql:
    image: mysql:8.0
    container_name: homglai-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: homglai_db
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d
    restart: unless-stopped

  mysql-test:
    image: mysql:8.0
    container_name: homglai-mysql-test
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: homglai_db_test
    ports:
      - "127.0.0.1:3307:3306"
    restart: unless-stopped

volumes:
  mysql_data:
